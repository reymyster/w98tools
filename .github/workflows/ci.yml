name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the local toolchain; Vite 8 needs ^20.19 || >=22.12.
          node-version: 24
          cache: npm

      - run: npm ci

      # Biome checks formatting, lint and import order in one pass.
      - name: Lint and format check
        run: npm run lint

      - name: Test
        run: npm test

      # Runs tsc -b first, so this type-checks as well as bundles.
      - name: Build
        run: npm run build
